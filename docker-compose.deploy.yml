services:
  beacontower:
    image: ghcr.io/yoahoug/beacontower:latest
    container_name: beacontower
    restart: unless-stopped
    user: root                      # RAPL energy_uj 宿主上仅 root 可读(0400)，非 root 容器读不到
    ports:
      - "10.66.66.66:8091:8080"   # 绑组网地址（组网内设备可直接访问）；走公网反代则改 127.0.0.1
    environment:
      - BEACON_MASTER_KEY=${BEACON_MASTER_KEY}   # .env 提供（openssl rand -hex 32）
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data        # SQLite 库 + master.key
      # 宿主 /proc 只读挂载：本机节点的网络/连接数/进程数与 CPU/内存同口径。注意
      # /proc/net 是 netns 维度的，采集侧经宿主 PID 1（/host/proc/1/net）读宿主网卡。
      - /proc:/host/proc:ro
      # 宿主 /sys 只读挂载：容器内 /sys 只见容器自身网卡（netns 维度），挂载后按
      # 「物理网卡」口径统计流量（排除 br0/veth/wg0/TUN 与物理网卡重复计数）。
      # 须挂整个 /sys：class/net/<if>/device 指向 /sys/devices/... 的符号链接，
      # 只挂子目录会因链接悬空判不出物理网卡。未挂载时退化为「流量最大的单接口」。
      - /sys:/host/sys:ro
      # Docker 默认 MaskedPaths 掩掉 /sys/devices/virtual/powercap（class 符号链接失效），
      # 只读挂到 /powercap-ro 兜底，采集逻辑自动探测两种布局。
      # 无 RAPL 的机器（多数云 ECS/虚拟机）没有这个宿主路径，Docker 会尝试创建挂载源并
      # 以「mkdir /sys/devices/virtual/powercap: operation not permitted」失败——这类机器
      # 请删掉本行再 up -d（没有功耗数据的物理来源，其余指标不受影响）。
      - /sys/devices/virtual/powercap:/powercap-ro:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 15s
