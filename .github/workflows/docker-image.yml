# Build & publish the BeaconTower image to GHCR on every push to main.
# The server pulls ghcr.io/yoahoug/beacontower:latest and runs docker compose
# up -d (deploy gate stays manual on the server); GHA cache keeps rebuilds fast.
name: Docker image (GHCR)

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'web/**'
      - 'internal/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/yoahoug/beacontower

jobs:
  build:
    name: Build & push (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### BeaconTower image built" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
