<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/beacon-toy.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>信标塔 · BeaconTower</title>
    <script>
      // 主题同步 boot（阻塞执行，模块加载前跑完，防闪屏；doc/18）：
      // 1) ?theme=<id> → 写偏好并 replace 到该主题路径（清掉参数防重复触发）
      // 2) 无参且偏好 ≠ 当前主题 → replace 过去。仅在「偏好 ≠ 当前」时跳，
      //    双向只会发生一次跳转，无重定向死循环。
      (function () {
        try {
          var THEMES = {
            toy: { path: '/', current: true },
            classic: { path: '/classic/', current: false },
          };
          var qs = new URLSearchParams(window.location.search);
          var wanted = qs.get('theme');
          if (wanted && THEMES[wanted]) {
            localStorage.setItem('beacontower_preferred_theme', wanted);
            qs.delete('theme');
            var rest = qs.toString();
            var target = THEMES[wanted].path + (rest ? '?' + rest : '');
            if (target !== window.location.pathname + window.location.search) {
              window.location.replace(target);
            }
            return;
          }
          var pref = localStorage.getItem('beacontower_preferred_theme');
          if (pref && THEMES[pref] && !THEMES[pref].current) {
            window.location.replace(THEMES[pref].path);
          }
        } catch (e) {
          /* localStorage 不可用（隐私模式）：原地渲染当前主题 */
        }
      })();
    </script>
  </head>
  <body class="bg-toy-bg text-toy-black antialiased selection:bg-toy-yellow selection:text-toy-black">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
