<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Toy Beacon Tower SVG -->
  <!-- Base block -->
  <rect x="8" y="38" width="32" height="6" rx="2" fill="#FFE047" stroke="#121212" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tower Body Lower -->
  <polygon points="12,38 15,22 33,22 36,38" fill="#FFFFFF" stroke="#121212" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Middle Red/Pink Stripe -->
  <polygon points="13.5,30 14.5,25 33.5,25 34.5,30" fill="#FF5E85" stroke="#121212" stroke-width="2"/>
  <!-- Observation Deck -->
  <rect x="13" y="18" width="22" height="4" rx="1" fill="#FFE047" stroke="#121212" stroke-width="2.5"/>
  <!-- Light Room -->
  <rect x="16" y="10" width="16" height="8" rx="1" fill="#FFF3A3" stroke="#121212" stroke-width="2.5"/>
  <!-- Glowing Light -->
  <circle cx="24" cy="14" r="3" fill="#FFE047" stroke="#121212" stroke-width="1.5"/>
  <!-- Beacon Roof Dome -->
  <path d="M 16 10 C 16 4 32 4 32 10 Z" fill="#FF5E85" stroke="#121212" stroke-width="2.5"/>
  <!-- Spire / Antenna -->
  <line x1="24" y1="4" x2="24" y2="1" stroke="#121212" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="1" r="1.5" fill="#00E599"/>
  <!-- Light Rays / Pulses -->
  <line x1="8" y1="12" x2="12" y2="13" stroke="#FFE047" stroke-width="2" stroke-linecap="round"/>
  <line x1="7" y1="16" x2="11" y2="15" stroke="#FFE047" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="12" x2="36" y2="13" stroke="#FFE047" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="16" x2="37" y2="15" stroke="#FFE047" stroke-width="2" stroke-linecap="round"/>
</svg>
